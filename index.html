<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Sachin Bhandari">
  <title>FlavorCraft - Online Recipe Sharing Platform - Built by Sachin Bhandari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          colors: {
            terracotta: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12'
            },
            saffron: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f'
            },
            sage: {
              50: '#f2f8f5',
              100: '#e1efe7',
              200: '#c2dfcf',
              300: '#98c7b0',
              400: '#6ea98f',
              500: '#488c71',
              600: '#2d7256',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-[#fdfbf7] text-stone-900 selection:bg-orange-600 selection:text-white">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-[#fdfbf7] p-4">
      <div class="text-center max-w-sm mx-auto p-6">
        <div class="relative w-16 h-16 mx-auto mb-5">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-600 to-amber-500 flex items-center justify-center text-white font-serif font-black text-2xl shadow-xl shadow-orange-600/30 animate-pulse">
            FC
          </div>
          <div class="absolute -inset-1.5 rounded-3xl border-2 border-orange-500/30 border-t-orange-600 animate-spin"></div>
        </div>
        <h2 class="text-2xl font-serif font-black text-stone-900 tracking-tight">FlavorCraft</h2>
        <p class="text-xs text-orange-700 font-bold uppercase tracking-widest mt-1">Online Recipe Sharing Platform</p>
        <div class="w-48 h-1.5 bg-stone-200 rounded-full mx-auto my-4 overflow-hidden">
          <div class="w-full h-full bg-gradient-to-r from-orange-500 via-amber-400 to-orange-600 rounded-full animate-pulse"></div>
        </div>
        <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-orange-50 border border-orange-200 text-stone-600 text-xs shadow-sm">
          <svg class="w-4 h-4 text-orange-600 animate-spin shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="text-[11px] font-medium text-stone-700">Waking up high-speed cloud platform, this may take a few seconds on initial launch!</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { auth } from "./js/auth.js";
    import { searchOnlineDishPhoto } from "./js/imageSearch.js";
    window.store = store;
    window.auth = auth;
    window.searchOnlineDishPhoto = searchOnlineDishPhoto;
  </script>
  <script type="text/babel" src="js/reactApp.js"></script>
</body>
</html>
