<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FoodBite">
  <meta name="application-name" content="FoodBite">
  <meta name="msapplication-TileColor" content="#09090b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="author" content="Sachin Bhandari">
  <title>FoodBite - Ephemeral Food Stories & Sharing - Built by Sachin Bhandari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          colors: {
            terracotta: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12'
            },
            saffron: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f'
            },
            sage: {
              50: '#f2f8f5',
              100: '#e1efe7',
              200: '#c2dfcf',
              300: '#98c7b0',
              400: '#6ea98f',
              500: '#488c71',
              600: '#2d7256',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css?v=20260921_05">
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-white selection:bg-orange-600 selection:text-white">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-zinc-950 p-4">
      <div class="text-center max-w-sm mx-auto p-6">
        <div class="relative w-16 h-16 mx-auto mb-5">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-600 to-amber-500 flex items-center justify-center text-white font-serif font-black text-2xl shadow-xl shadow-orange-600/30 animate-pulse">
            🔥
          </div>
          <div class="absolute -inset-1.5 rounded-3xl border-2 border-orange-500/30 border-t-orange-600 animate-spin"></div>
        </div>
        <h2 class="text-2xl font-black text-white tracking-tight">FoodBite</h2>
        <p class="text-xs text-orange-400 font-bold uppercase tracking-widest mt-1">Ephemeral Food Stories</p>
        <div class="w-48 h-1.5 bg-zinc-800 rounded-full mx-auto my-4 overflow-hidden">
          <div class="w-full h-full bg-gradient-to-r from-orange-500 via-amber-400 to-orange-600 rounded-full animate-pulse"></div>
        </div>
        <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs shadow-sm">
          <span class="text-[11px] font-medium">Launching ephemeral food platform...</span>
        </div>
        <div id="splash-failsafe" class="mt-4 hidden">
          <button type="button" onclick="if(window.caches){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));} if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));} window.location.reload(true);" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white text-xs font-black uppercase tracking-wider shadow-lg shadow-orange-600/30 active:scale-95 transition-all cursor-pointer">
            🔄 Refresh to Latest Version
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { auth } from "./js/auth.js";
    import { searchOnlineDishPhoto } from "./js/imageSearch.js";
    window.store = store;
    window.auth = auth;
    window.searchOnlineDishPhoto = searchOnlineDishPhoto;
  </script>
  <script type="text/babel" src="js/reactApp.js?v=20260921_05"></script>
  <script>
    setTimeout(function() {
      var fs = document.getElementById('splash-failsafe');
      if (fs) fs.classList.remove('hidden');
    }, 2500);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
