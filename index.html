<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FoodBite">
  <meta name="application-name" content="FoodBite">
  <meta name="msapplication-TileColor" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="author" content="Sachin Bhandari">
  <title>FoodBite - Discover. Share. Crave. - Built by Sachin Bhandari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          },
          colors: {
            charcoal: {
              DEFAULT: '#121214',
              50: '#f4f4f5',
              100: '#e4e4e7',
              200: '#d4d4d8',
              800: '#18181b',
              900: '#121214'
            },
            coral: {
              DEFAULT: '#f05a28',
              50: '#fff5f0',
              100: '#ffe8de',
              200: '#ffd0be',
              500: '#f05a28',
              600: '#d94918',
              700: '#b83b12'
            },
            cream: {
              DEFAULT: '#fbf9f6',
              50: '#ffffff',
              100: '#fbf9f6',
              200: '#f5f2eb',
              300: '#e8e4dc',
              400: '#d8d2c6'
            },
            terracotta: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css?v=20260921_14">
</head>
<body class="min-h-screen flex flex-col bg-[#fbf9f6] text-[#1a1917] font-sans antialiased selection:bg-[#f05a28] selection:text-white">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-orange-50/60 via-stone-50 to-amber-50/40 p-4">
      <div class="text-center max-w-sm mx-auto p-6">
        <div class="relative w-16 h-16 mx-auto mb-5">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-600 to-amber-500 flex items-center justify-center text-white font-serif font-black text-2xl shadow-xl shadow-orange-600/30 animate-pulse">
            🔥
          </div>
          <div class="absolute -inset-1.5 rounded-3xl border-2 border-orange-500/30 border-t-orange-600 animate-spin"></div>
        </div>
        <h2 class="text-2xl font-black text-stone-900 tracking-tight font-serif">FoodBite</h2>
        <p class="text-xs text-orange-600 font-bold uppercase tracking-widest mt-1">Ephemeral Food Stories</p>
        <div class="w-48 h-1.5 bg-stone-200 rounded-full mx-auto my-4 overflow-hidden">
          <div class="w-full h-full bg-gradient-to-r from-orange-500 via-amber-400 to-orange-600 rounded-full animate-pulse"></div>
        </div>
        <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-600 text-xs shadow-sm">
          <span class="text-[11px] font-medium">Launching ephemeral food platform...</span>
        </div>
        <div id="splash-failsafe" class="mt-4 hidden">
          <button type="button" onclick="if(window.caches){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));} if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));} window.location.reload(true);" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white text-xs font-black uppercase tracking-wider shadow-lg shadow-orange-600/30 active:scale-95 transition-all cursor-pointer">
            🔄 Refresh to Latest Version
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { auth } from "./js/auth.js";
    import { searchOnlineDishPhoto } from "./js/imageSearch.js";
    window.store = store;
    window.auth = auth;
    window.searchOnlineDishPhoto = searchOnlineDishPhoto;
  </script>
  <script defer src="js/reactApp.js?v=20260921_19"></script>
  <script>
    setTimeout(function() {
      var fs = document.getElementById('splash-failsafe');
      if (fs) fs.classList.remove('hidden');
    }, 2500);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
