<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11110F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FoodBite">
  <meta name="application-name" content="FoodBite">
  <meta name="msapplication-TileColor" content="#11110F">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="author" content="Sachin Bhandari">
  <title>FOODBITE® — DISCOVER. SHARE. CRAVE. — Editorial Food Publication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Bebas Neue', 'Space Grotesk', 'sans-serif'],
            grotesk: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          },
          colors: {
            fbDark: '#11110F',
            fbSurface: '#181714',
            fbCream: '#F2EBDD',
            fbOrange: '#FF5428',
            fbMutedOrange: '#C94325',
            fbMuted: '#85817A',
            fbWhite: '#F7F4ED',
            fbBorder: '#262420'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css?v=20260923_02">
</head>
<body class="min-h-screen flex flex-col bg-[#11110F] text-[#F2EBDD] font-sans antialiased selection:bg-[#FF5428] selection:text-white">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-[#11110F] p-4 text-[#F2EBDD]">
      <div class="text-center max-w-sm mx-auto p-6 space-y-4">
        <div class="inline-flex items-center space-x-2 px-3 py-1 border border-[#262420] bg-[#181714] text-[10px] uppercase font-mono tracking-widest text-[#FF5428]">
          <span>01 / DISCOVER</span>
        </div>
        <h2 class="text-4xl sm:text-5xl font-black text-[#F7F4ED] tracking-tighter uppercase font-display leading-none">
          FOODBITE®
        </h2>
        <p class="text-[11px] text-[#85817A] uppercase tracking-widest font-mono">
          DISCOVER. SHARE. CRAVE.
        </p>
        <div class="w-32 h-[2px] bg-[#262420] mx-auto overflow-hidden">
          <div class="w-full h-full bg-[#FF5428] animate-pulse"></div>
        </div>
        <div id="splash-failsafe" class="mt-4 hidden">
          <button type="button" onclick="if(window.caches){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));} if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));} window.location.reload(true);" class="px-4 py-2 border border-[#FF5428] bg-[#FF5428] hover:bg-[#C94325] text-white text-[11px] font-bold uppercase tracking-wider transition-all cursor-pointer">
            Reload Platform
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { auth } from "./js/auth.js";
    import { searchOnlineDishPhoto } from "./js/imageSearch.js";
    window.store = store;
    window.auth = auth;
    window.searchOnlineDishPhoto = searchOnlineDishPhoto;
  </script>
  <script defer src="js/reactApp.js?v=20260923_02"></script>
  <script>
    setTimeout(function() {
      var fs = document.getElementById('splash-failsafe');
      if (fs) fs.classList.remove('hidden');
    }, 2500);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
