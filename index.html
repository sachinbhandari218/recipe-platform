<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FoodBite">
  <meta name="application-name" content="FoodBite">
  <meta name="msapplication-TileColor" content="#FFF9F5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="author" content="Sachin Bhandari">
  <title>FoodBite - Discover. Share. Crave. - Built by Sachin Bhandari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          },
          colors: {
            charcoal: {
              DEFAULT: '#171717',
              50: '#f7f6f5',
              100: '#e8e6e3',
              200: '#d0ccc6',
              800: '#262626',
              900: '#171717'
            },
            coral: {
              DEFAULT: '#FF5A2A',
              50: '#FFF0E8',
              100: '#FFE4D6',
              200: '#FFB38F',
              500: '#FF5A2A',
              600: '#E6471A',
              700: '#C2350E'
            },
            cream: {
              DEFAULT: '#FFF9F5',
              50: '#FFFFFF',
              100: '#FFF9F5',
              200: '#FFF0E8',
              300: '#F5EBE1',
              400: '#E8DCCF'
            },
            muted: {
              DEFAULT: '#8A817B',
              400: '#A39B95',
              500: '#8A817B',
              600: '#6E6660'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css?v=20260923_01">
</head>
<body class="min-h-screen flex flex-col bg-[#FFF9F5] text-[#171717] font-sans antialiased selection:bg-[#FF5A2A] selection:text-white">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-[#FFF0E8] via-[#FFF9F5] to-white p-4">
      <div class="text-center max-w-sm mx-auto p-6">
        <div class="relative w-16 h-16 mx-auto mb-5">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#FF5A2A] to-[#FFB38F] flex items-center justify-center text-white font-serif font-black text-2xl shadow-xl shadow-[#FF5A2A]/30 animate-pulse">
            🔥
          </div>
          <div class="absolute -inset-1.5 rounded-3xl border-2 border-[#FF5A2A]/30 border-t-[#FF5A2A] animate-spin"></div>
        </div>
        <h2 class="text-2xl font-black text-[#171717] tracking-tight font-serif">FoodBite</h2>
        <p class="text-xs text-[#FF5A2A] font-bold uppercase tracking-widest mt-1">Discover. Share. Crave.</p>
        <div class="w-48 h-1.5 bg-[#F0ECE4] rounded-full mx-auto my-4 overflow-hidden">
          <div class="w-full h-full bg-gradient-to-r from-[#FF5A2A] via-[#FFB38F] to-[#FF5A2A] rounded-full animate-pulse"></div>
        </div>
        <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-white border border-[#F0ECE4] text-[#8A817B] text-xs shadow-xs">
          <span class="text-[11px] font-medium">Launching food discovery platform...</span>
        </div>
        <div id="splash-failsafe" class="mt-4 hidden">
          <button type="button" onclick="if(window.caches){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));} if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));} window.location.reload(true);" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF5A2A] to-[#E6471A] hover:from-[#E6471A] hover:to-[#C2350E] text-white text-xs font-black uppercase tracking-wider shadow-lg shadow-[#FF5A2A]/30 active:scale-95 transition-all cursor-pointer">
            🔄 Refresh to Latest Version
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { auth } from "./js/auth.js";
    import { searchOnlineDishPhoto } from "./js/imageSearch.js";
    window.store = store;
    window.auth = auth;
    window.searchOnlineDishPhoto = searchOnlineDishPhoto;
  </script>
  <script defer src="js/reactApp.js?v=20260923_01"></script>
  <script>
    setTimeout(function() {
      var fs = document.getElementById('splash-failsafe');
      if (fs) fs.classList.remove('hidden');
    }, 2500);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
